[package]
name = "octoterm-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "octoterm_desktop"
path = "src/lib.rs"

[[bin]]
name = "octoterm-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = "3"
directories = "5"
egui = "0.36"
egui-wgpu = { version = "0.36", features = ["winit"] }
# 关掉默认特性是为了不把 X11 / Wayland / accesskit 拉进来;`clipboard` 必须留着,
# 否则 egui 文本框的复制粘贴只在本进程内生效,拷不出去也贴不进来。
egui-winit = { version = "0.36", default-features = false, features = ["clipboard"] }
fs4 = { version = "1", features = ["sync"] }
octoterm-server = { path = "../server" }
open = "5"
# 版本与 crates/server/Cargo.toml 保持一致,不要升级(那边已经在用它解析 iTerm2 的偏好设置)。
plist = "1"
png = "0.18"
pollster = "0.4"
rfd = { version = "0.15", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tray-icon = "0.24"
# 版本与 crates/server/Cargo.toml 保持一致:「重新生成 token」要和 server 的
# resolve_token 产出同一种格式。
uuid = { version = "1", features = ["v4"] }
winit = "0.30.13"

[dev-dependencies]
futures-util = "0.3"
octoterm-protocol = { path = "../protocol" }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = "0.26"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
