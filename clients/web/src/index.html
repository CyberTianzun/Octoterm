<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>octoterm</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-head">
        <span id="logo">octoterm</span>
        <button id="new-session" title="新建会话">+</button>
      </div>
      <nav id="session-nav"></nav>
      <div id="sidebar-foot">本地会话内核 · <span id="conn-state">已连接</span></div>
    </aside>
    <div id="scrim" hidden></div>
    <main id="workspace">
      <button id="menu" title="会话列表">☰</button>
      <div id="reconnect-banner" hidden>reconnecting…</div>
      <div id="workspace-empty">在左侧选择一个会话,或新建一个</div>
      <div id="terminal-wrap" hidden><div id="terminal"></div></div>
    </main>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
