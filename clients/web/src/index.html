<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>octoterm</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-head">
        <button id="sidebar-position" type="button" data-i18n-title="sidebar.pinRight" aria-controls="sidebar"></button>
        <span id="logo">octoterm</span>
        <button id="back-to-list" data-i18n-title="app.backToList" hidden>⊞</button>
        <button id="open-settings" data-i18n-title="app.settings">⚙</button>
        <button id="new-session" data-i18n-title="app.newSession">+</button>
      </div>
      <nav id="session-nav"></nav>
      <div id="sidebar-foot"><span data-i18n="app.kernel"></span> · <span id="conn-state"></span></div>
    </aside>
    <div id="scrim" hidden></div>
    <main id="workspace">
      <button id="menu" data-i18n-title="app.sessionList" aria-controls="sidebar" aria-expanded="false">☰</button>
      <button id="sidebar-show" type="button" data-i18n-title="sidebar.show" aria-controls="sidebar" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m5-11-3 3 3 3"/></svg>
      </button>
      <div id="reconnect-banner" hidden></div>
      <div id="error-banner" hidden></div>
      <div id="agent-banner" hidden></div>
      <div id="session-list"></div>
      <div id="chat-view" hidden></div>
      <div id="terminal-wrap" hidden><div id="terminal"></div></div>
    </main>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
